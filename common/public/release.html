<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>发版记录 · Sparrow</title>
  <meta name="description" content="Sparrow 各版本的发布说明汇总，最新靠前。">
  <style>
    :root{--bg:#07070d;--panel:rgba(255,255,255,.03);--border:rgba(255,255,255,.10);--text:#f4f4f7;--muted:#a0a3bb;--faint:#69667e;--a:#6d5cff;--a2:#22d3ee;--a3:#a855f7;--r:18px}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,rgba(109,92,255,.14),transparent 60%),radial-gradient(900px 500px at 10% 10%,rgba(34,211,238,.10),transparent 55%),var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
    a{color:var(--a2);text-decoration:none}
    a:hover{color:var(--a3)}
    .bar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--border);background:rgba(7,7,13,.82);backdrop-filter:blur(16px)}
    .brand{font-weight:700;color:var(--text)}
    .brand span{background:linear-gradient(135deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
    .bar nav{display:flex;gap:20px;font-size:13px}
    .bar nav a{color:var(--muted)}
    .bar nav a:hover{color:var(--text)}
    .wrap{max-width:880px;margin:0 auto;padding:48px 24px 64px}
    .crumb{font-size:12px;color:var(--muted);letter-spacing:.04em}
    .head h1{margin:.3em 0 .3em;font-size:34px;line-height:1.25;background:linear-gradient(90deg,var(--a),var(--a2),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
    .meta{font-size:13px;color:var(--faint)}
    .releases{list-style:none;margin:28px 0 0;padding:0;display:flex;flex-direction:column;gap:16px}
    .release{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:20px 24px}
    .release-title{font-size:17px;font-weight:700;color:var(--text)}
    .release-title:hover{color:var(--a2)}
    .release-meta{display:block;margin-top:6px;font-size:12px;color:var(--faint)}
    .release-summary{margin:10px 0 0;font-size:14px;color:var(--muted)}
    .empty{color:var(--faint);text-align:center;padding:40px 0;font-size:14px}
    .foot{max-width:880px;margin:0 auto;padding:20px 24px 48px;display:flex;justify-content:space-between;border-top:1px solid var(--border);color:var(--muted);font-size:13px}
  </style>
</head>
<body id="top">
  <header class="bar">
    <a class="brand" href="/">sparrow <span>/ RELEASE</span></a>
    <nav><a href="/">返回首页</a></nav>
  </header>
  <main class="wrap">
    <header class="head">
      <p class="crumb">Release Notes</p>
      <h1>发版记录</h1>
      <p class="meta">各版本的发布说明汇总，最新靠前。</p>
    </header>
    <ol class="releases">
      <!-- 在此插入新条目（最新靠前） -->
      <li class="release">
        <a class="release-title" href="/release-node/2026-10-10.html">2026-10-10</a>
        <span class="release-meta">2026-10-10</span>
        <p class="release-summary">修复邮件发送被 Gmail 拒收、博客页导航错误与切换中文后导航条错位三处问题。</p>
      </li>
    </ol>
  </main>
  <footer class="foot">
    <a href="/">← 返回首页</a><a href="#top">返回顶部 ↑</a>
  </footer>
</body>
</html>
