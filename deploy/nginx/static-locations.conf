# Install as /etc/nginx/snippets/sparrow-static-locations.conf.
# Include inside each static server after setting $sparrow_site and root.
index index.html;
autoindex off;

# Keep immutable chunks from previous releases at their original URLs.
# Publication must merge each release's _next/static into the site's archive.
location ^~ /_next/static/ {
    try_files $uri @sparrow_static_archive;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location @sparrow_static_archive {
    root /srv/sparrow/assets/$sparrow_site;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Includes HTML, App Router .txt data, public documents and unversioned media.
# The root index remains the client locale entry; there is no SPA fallback.
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
}

error_page 404 /404.html;
location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
}
