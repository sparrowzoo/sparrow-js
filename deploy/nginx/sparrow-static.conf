# Include this file inside nginx.conf's http {} block.
# Load mime.types in http {} and install static-locations.conf at the path below.
# HTTP is intentional for this release; API / WebSocket / iframe origins match it.
# Confirm API and WebSocket upstream ports before installing in production.
# Keep only one server_names_hash_bucket_size directive in the http {} block.
server_names_hash_bucket_size 64;

map $http_upgrade $sparrow_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name sparrowzoo.com;
    return 308 http://www.sparrowzoo.com$request_uri;
}

server {
    listen 80;
    server_name coder.sparrowzoo.com;
    return 308 http://admin.sparrowzoo.com$request_uri;
}

server {
    listen 80;
    server_name www.sparrowzoo.com;
    set $sparrow_site www;
    root /srv/sparrow/current/www;

    # Only known application paths migrate. Public .html documents stay intact.
    location ~ ^/products/(coder|passport|file|im)(?:\.html)?/?$ {
        return 308 /zh/products/$1/$is_args$args;
    }
    location ~ ^/(zh|en)/products/(coder|passport|file|im)\.html$ {
        return 308 /$1/products/$2/$is_args$args;
    }
    location ~ ^/(products|study|ui|upload|table|forms|hooks|draggable|error|loading|access-histories|eslint-config|i18n-static-export|zip-download)/?$ {
        return 308 /zh/$1/$is_args$args;
    }

    include /etc/nginx/snippets/sparrow-static-locations.conf;
}

server {
    listen 80;
    server_name admin.sparrowzoo.com;
    set $sparrow_site admin;
    root /srv/sparrow/current/admin;

    # Compatibility for the former next-intl /coder alias.
    location ~ ^/(zh|en)/coder/?$ {
        return 308 /$1/project-config/$is_args$args;
    }
    location = /coder {
        return 308 /zh/project-config/$is_args$args;
    }
    location = /coder/ {
        return 308 /zh/project-config/$is_args$args;
    }

    include /etc/nginx/snippets/sparrow-static-locations.conf;
}

server {
    listen 80;
    server_name im.sparrowzoo.com;
    set $sparrow_site im;
    root /srv/sparrow/current/im;

    include /etc/nginx/snippets/sparrow-static-locations.conf;
}

server {
    listen 80;
    server_name passport.sparrowzoo.com;
    set $sparrow_site passport;
    root /srv/sparrow/current/passport;

    location = /cros-storage {
        return 308 /cros-storage/$is_args$args;
    }
    location ^~ /cros-storage/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        # Match NEXT_PUBLIC_ALLOW_ORIGINS. Do not add X-Frame-Options here.
        add_header Content-Security-Policy "frame-ancestors 'self' http://www.sparrowzoo.com http://admin.sparrowzoo.com http://im.sparrowzoo.com http://passport.sparrowzoo.com http://coder.sparrowzoo.com" always;
    }

    include /etc/nginx/snippets/sparrow-static-locations.conf;
}

server {
    listen 80;
    server_name api.sparrowzoo.com;

    # Keep OPTIONS, Authorization, cookies and CORS decisions in the backend.
    # Preserve the existing gateway limit; the backend may enforce a lower limit.
    client_max_body_size 128m;
    location / {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /websocket {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sparrow_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
}
