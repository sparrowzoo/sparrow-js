user www www;
worker_processes  1;
error_log  /var/log/nginx_error.log  info;
pid        /var/nginx.pid;

events {
    worker_connections  128;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx_access.log  main;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 16 64k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types text/plain application/x-javascript text/css application/xml;
    gzip_vary on;

    # WebSocket 升级变量
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---------- upstream ----------
    upstream monitor   { server 127.0.0.1:9001; }
    upstream api       { server 127.0.0.1:8888; }
    upstream websocket { server 127.0.0.1:8080; }
    upstream nacos     { server 127.0.0.1:8848; }
    upstream lottery   { server 127.0.0.1:9999; }

    # =====================================================================
    # 静态站点（对外公开，启用 HTTPS）
    # =====================================================================

    # --- r.sparrowzoo.net ---
    server {
        listen 80;
        server_name r.sparrowzoo.net;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name r.sparrowzoo.net;
        ssl_certificate     /etc/letsencrypt/live/r.sparrowzoo.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/r.sparrowzoo.net/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            root   /workspace/sparrow-js/sparrow/source;
            expires 1h;
        }
    }

    # --- passport.sparrowzoo.com ---
    server {
        listen 80;
        server_name passport.sparrowzoo.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name passport.sparrowzoo.com;
        ssl_certificate     /etc/letsencrypt/live/passport.sparrowzoo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/passport.sparrowzoo.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            try_files $uri $uri.html $uri/ =404;
            root   /workspace/deploy/passport;
            expires 1h;
        }
    }

    # --- admin.sparrowzoo.com ---
    server {
        listen 80;
        server_name admin.sparrowzoo.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name admin.sparrowzoo.com;
        ssl_certificate     /etc/letsencrypt/live/admin.sparrowzoo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.sparrowzoo.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            try_files $uri $uri.html $uri/ =404;
            root   /workspace/deploy/admin;
            expires 1h;
        }
    }

    # --- im.sparrowzoo.com ---
    server {
        listen 80;
        server_name im.sparrowzoo.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name im.sparrowzoo.com;
        ssl_certificate     /etc/letsencrypt/live/im.sparrowzoo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/im.sparrowzoo.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            try_files $uri $uri.html $uri/ =404;
            root   /workspace/deploy/im;
            expires 1h;
        }
    }

    # --- www.sparrowzoo.com ---
    server {
        listen 80;
        server_name www.sparrowzoo.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name www.sparrowzoo.com;
        ssl_certificate     /etc/letsencrypt/live/www.sparrowzoo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.sparrowzoo.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            try_files $uri $uri.html $uri/ =404;
            root   /workspace/deploy/www;
            expires 1h;
        }
    }

    # --- img.im.sparrowzoo.net ---
    server {
        listen 80;
        server_name img.im.sparrowzoo.net;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name img.im.sparrowzoo.net;
        ssl_certificate     /etc/letsencrypt/live/img.im.sparrowzoo.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/img.im.sparrowzoo.net/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            root   /var/chat/image;
            expires 0d;
        }
    }

    # --- u.r.sparrowzoo.net ---
    server {
        listen 80;
        server_name u.r.sparrowzoo.net;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name u.r.sparrowzoo.net;
        ssl_certificate     /etc/letsencrypt/live/u.r.sparrowzoo.net/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/u.r.sparrowzoo.net/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        location / {
            root   /workspace/upload;
            expires 0d;
        }
    }

    # =====================================================================
    # 反向代理（对外公开，启用 HTTPS）
    # =====================================================================

    # --- lottery.sparrowzoo.com ---
    server {
        listen 80;
        server_name lottery.sparrowzoo.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name lottery.sparrowzoo.com;
        ssl_certificate     /etc/letsencrypt/live/lottery.sparrowzoo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/lottery.sparrowzoo.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        charset utf-8;

        location / {
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50m;
            add_header Cache-Control no-store;
            proxy_pass http://lottery;
        }
    }


    # --- api.sparrowzoo.com ---
    server {
        listen 80;
        server_name api.sparrowzoo.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name api.sparrowzoo.com;
        ssl_certificate     /etc/letsencrypt/live/api.sparrowzoo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.sparrowzoo.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        charset utf-8;

        location / {
            client_max_body_size 128m;
            client_body_buffer_size 128k;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control no-store;
            proxy_pass http://api;
        }

        location /websocket {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 50m;
            proxy_pass http://websocket;
        }
    }

    # --- blog.sparrowzoo.com ---
    server {
        listen 80;
        server_name blog.sparrowzoo.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        server_name blog.sparrowzoo.com;
        ssl_certificate     /etc/letsencrypt/live/blog.sparrowzoo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/blog.sparrowzoo.com/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
        charset utf-8;

        location / {
            client_max_body_size 128m;
            client_body_buffer_size 128k;
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            add_header Cache-Control no-store;
            proxy_pass http://api;
        }
    }

    # =====================================================================
    # 内部管理域名（保持 80，不对外）
    # =====================================================================

    # --- nacos.sparrowzoo.com ---
    server {
        listen 80;
        server_name nacos.sparrowzoo.com;
        charset utf-8;

        location / {
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 50m;
            add_header Cache-Control no-store;
            proxy_pass http://nacos;
        }
    }

    # --- monitor.sparrowzoo.com ---
    server {
        listen 80;
        server_name monitor.sparrowzoo.com;
        charset utf-8;

        location / {
            proxy_redirect off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header REMOTE-HOST $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 50m;
            add_header Cache-Control no-store;
            proxy_pass http://monitor;
        }
    }

    # --- ossrh-86752.sparrowzoo.com ---
    server {
        listen 80;
        server_name ossrh-86752.sparrowzoo.com;
        index index.html;

        location / {
            root   /workspace/OSSRH-86752;
            expires 0d;
        }
    }
}
